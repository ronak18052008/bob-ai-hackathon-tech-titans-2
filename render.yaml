# =============================================================================
# MedBrief AI — Render Infrastructure Blueprint (render.yaml)
# =============================================================================
# Deploys both backend (FastAPI Web Service) and frontend (Vite Static Site)
# with automatic service-to-service URL and CORS configuration on Render.
# =============================================================================

services:
  # ── 1. Backend Web Service (FastAPI + Uvicorn) ──────────────────────────────
  - type: web
    name: medbrief-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r src/backend/requirements.txt"
    startCommand: "python -m uvicorn src.backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: .
      - key: GEMINI_API_KEY
        sync: false  # Paste your Google Gemini API key during setup
      - key: CORS_ORIGINS
        value: "*"   # Or set specific frontend URL once deployed

  # ── 2. Frontend Static Site (React 19 + TypeScript + Vite) ──────────────────
  - type: web
    name: medbrief-web
    runtime: static
    plan: free
    region: oregon
    rootDir: src/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      # SPA rewrite rule: routes all non-file URLs to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medbrief-api
          property: url
